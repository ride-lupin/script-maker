<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>Reserved Click Test Page</title>
    <style>
      body {
        margin: 32px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .stack {
        display: grid;
        gap: 12px;
        max-width: 360px;
      }

      button,
      a,
      input {
        min-height: 36px;
        font: inherit;
      }

      #log {
        min-height: 40px;
        padding: 12px;
        border: 1px solid #ccd3dc;
      }
    </style>
  </head>
  <body>
    <main class="stack">
      <button data-label="first">신청</button>
      <button data-label="second">신청</button>
      <a href="#clicked" role="button" data-label="link">신청 링크</a>
      <input type="submit" value="신청 제출" data-label="submit">
      <p id="log">대기 중</p>
    </main>

    <script>
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-label]");
        if (!target) return;

        event.preventDefault();
        document.querySelector("#log").textContent = `${target.dataset.label} clicked at ${new Date().toLocaleTimeString()}`;
      });
    </script>
  </body>
</html>
