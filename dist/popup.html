<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserved Click</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <form id="schedule-form" class="form">
        <div class="datetime-fields">
          <label class="field">
            <span>날짜</span>
            <input id="target-date" name="targetDate" type="date" required>
          </label>

          <label class="field">
            <span>시간</span>
            <input id="target-time" name="targetTime" type="time" step="1" required>
          </label>
        </div>

        <label class="field">
          <span>버튼명</span>
          <input id="button-text" name="buttonText" type="text" autocomplete="off" required>
        </label>

        <label class="field">
          <span>버튼 순번</span>
          <input id="target-index" name="targetIndex" type="number" min="1" step="1" value="1" required>
        </label>

        <div class="actions">
          <button type="submit">예약 실행</button>
          <button id="cancel-button" type="button" class="secondary">예약 취소</button>
        </div>
      </form>

      <section class="status" aria-live="polite">
        <h1>상태</h1>
        <dl id="status-list"></dl>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
