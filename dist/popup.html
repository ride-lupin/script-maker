<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserved Click</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <section class="current-time" aria-live="polite">
        <span id="current-time-label">현재 시각</span>
        <strong id="current-time-value">확인 중...</strong>
      </section>

      <form id="schedule-form" class="form">
        <div class="datetime-fields">
          <label class="field">
            <span>날짜</span>
            <input id="target-date" name="targetDate" type="date" required>
          </label>

          <label class="field">
            <span>시간</span>
            <input id="target-time" name="targetTime" type="time" step="1" required>
          </label>
        </div>

        <section class="mode-panel">
          <button id="select-button" type="button" class="secondary wide">브라우저에서 선택</button>
          <p id="selected-target" class="selected-target">선택된 버튼 없음</p>
        </section>

        <div class="actions">
          <button type="submit">예약 실행</button>
          <button id="cancel-button" type="button" class="secondary">예약 취소</button>
        </div>
      </form>

      <section class="status" aria-live="polite">
        <h1>상태</h1>
        <dl id="status-list"></dl>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
